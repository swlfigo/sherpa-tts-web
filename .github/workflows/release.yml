# Pushing a tag such as v0.1.0 publishes a GitHub release with the program
# for linux-amd64 and linux-arm64. No container image is published: build
# it from the Dockerfile (docker compose up -d --build).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          name="sherpa-tts-web-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          docker buildx build --platform "linux/${{ matrix.arch }}" --target dist \
            --build-arg "VERSION=${GITHUB_REF_NAME}" \
            --output "type=local,dest=out/$name" .
          tar -C out -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes ||
            gh release view "$GITHUB_REF_NAME" >/dev/null # the other job created it
          gh release upload "$GITHUB_REF_NAME" sherpa-tts-web-*.tar.gz* --clobber
